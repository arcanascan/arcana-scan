
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Primeira Chave | Forja Arcana</title>

    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at top, #34204f, transparent 55%),
                #100b19;
            color: #f5edff;
        }

        main {
            width: 100%;
            max-width: 460px;
            padding: 36px;
            background: #21162f;
            border: 1px solid #6c4c8e;
            border-radius: 20px;
            box-shadow: 0 20px 70px #0007;
        }

        .symbol {
            text-align: center;
            font-size: 42px;
        }

        h1 {
            margin: 12px 0 8px;
            text-align: center;
            color: #e5c6ff;
        }

        .subtitle {
            text-align: center;
            color: #cbb8dc;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #69537d;
            border-radius: 9px;
            background: #130e1e;
            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #bb88f0;
            outline-offset: 1px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #a775e2;
            color: #160d22;
            font-weight: bold;
            font-size: 16px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .notice {
            margin-top: 18px;
            padding: 13px;
            border: 1px solid #74558d;
            border-radius: 9px;
            color: #e1cbed;
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <main>
        <div class="symbol">👑🔮</div>

        <h1>A Primeira Chave</h1>

        <p class="subtitle">
            Inicialização segura da proprietária
            da FORJA ARCANA.
        </p>

        <form id="setup-form">
            <label for="name">Nome</label>
            <input
                id="name"
                name="name"
                autocomplete="name"
                required
                maxlength="100"
            >

            <label for="email">E-mail</label>
            <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
            >

            <label for="username">Nome de usuário</label>
            <input
                id="username"
                name="username"
                autocomplete="username"
                minlength="3"
                maxlength="32"
                required
            >

            <label for="password">Senha</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="12"
                required
            >

            <label for="setup-secret">
                Chave temporária de inicialização
            </label>
            <input
                id="setup-secret"
                name="setup-secret"
                type="password"
                autocomplete="off"
                required
            >

         
<button id="submit-button" type="submit">
    Criar minha conta de ADM principal
</button>


        <div class="notice">
            🔐 Esta é uma interface de preparação.
            O cadastro será habilitado somente depois
            que a autenticação segura estiver
            implementada no servidor.
        </div>
    </main>

    <script>
        const form = document.getElementById("setup-form");
        const button = document.getElementById("submit-button");

        const message = document.createElement("p");
        message.setAttribute("role", "status");
        message.setAttribute("aria-live", "polite");
        message.style.lineHeight = "1.6";
        message.style.marginTop = "16px";
        form.appendChild(message);

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            button.disabled = true;
            button.textContent = "Criando conta...";
            message.textContent = "";

            const payload = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                username: document.getElementById("username").value,
                password: document.getElementById("password").value,
                setupSecret: document.getElementById("setup-secret").value
            };

            try {
                const response = await fetch(
                    "/api/forja/setup-owner",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        credentials: "same-origin",
                        cache: "no-store",
                        body: JSON.stringify(payload)
                    }
                );

                const result = await response.json();

                if (!response.ok || !result.ok) {
                    throw new Error(
                        result.error || "Não foi possível criar a conta."
                    );
                }

                message.style.color = "#b9f5cc";
                message.textContent =
                    "Conta principal criada com sucesso! " +
                    "Aguarde a configuração do login.";

                form.reset();
                button.textContent = "Conta criada";
            } catch (error) {
                message.style.color = "#ffb8c5";
                message.textContent =
                    error.message || "Erro ao criar a conta.";

                button.disabled = false;
                button.textContent =
                    "Criar minha conta de ADM principal";
            }
        });
    </script>
</body>
</html>

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gêneros e Tags | FORJA ARCANA</title><link rel="stylesheet" href="forja-menu.css">
<style>
:root{color-scheme:dark;--bg:#0e0916;--panel:#21132d;--line:#62457a;--gold:#e5c589;--purple:#b891d9;--text:#f6edfc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#301942,#0e0916 70%);color:var(--text);font:15px/1.5 system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:32px 22px 80px}h1,h2{font-family:Georgia,serif}h1{color:var(--gold);font-size:clamp(27px,4vw,40px);margin:0}h2{color:var(--gold);margin:0 0 10px}p{color:#cfb9df}a{color:#e5c589}
.columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.panel{border:1px solid var(--line);background:linear-gradient(140deg,#25152f,#160d20);border-radius:18px;padding:22px;min-width:0}
form{display:flex;gap:8px;margin:16px 0}input{min-width:0;flex:1;width:100%;border:1px solid #72548b;border-radius:9px;background:#110c1b;color:white;padding:11px;font:inherit}button{cursor:pointer;background:#8253a4;border:1px solid #cba4e9;color:white;border-radius:9px;padding:10px 13px;font:600 13px system-ui}button:hover{background:#9968b9}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#31203e}.danger{background:#572335;border-color:#a95c74}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #493151}.item:last-child{border:0}.item span{overflow-wrap:anywhere}.actions{display:flex;gap:6px;flex-shrink:0}.actions button{padding:7px 9px}.status{min-height:24px;color:#e4c8fa}.count{font-size:13px;color:#d0b7e2}#app[hidden]{display:none!important}
@media(max-width:820px){.columns{grid-template-columns:1fr}main{padding:24px 14px 60px}.panel{padding:16px}.actions{gap:4px}}
</style></head><body><main><small>⚒️ FORJA ARCANA • BIBLIOTECA</small><h1>Grimório de Gêneros e Tags</h1>
<p>Classificações iniciais inspiradas na organização da Lezhin, adaptadas à ARCANA. Você pode cadastrar novas opções, renomear e excluir as que não estiverem associadas a obras.</p>
<p><a href="painel.html">← Voltar ao Salão de Comando</a></p>
<div id="status" class="status" role="status"></div><div id="app" class="columns" hidden>
<section class="panel"><h2>📚 Gêneros</h2><p class="count" id="genresCount"></p><form id="genresForm"><input name="name" aria-label="Nome do novo gênero" maxlength="80" placeholder="Novo gênero" required><button type="submit">+ Cadastrar</button></form><input id="genresSearch" aria-label="Pesquisar gêneros" placeholder="Pesquisar gêneros..." type="search"><div id="genresList"></div></section>
<section class="panel"><h2>🏷️ Tags</h2><p class="count" id="tagsCount"></p><form id="tagsForm"><input name="name" aria-label="Nome da nova tag" maxlength="80" placeholder="Nova tag" required><button type="submit">+ Cadastrar</button></form><input id="tagsSearch" aria-label="Pesquisar tags" placeholder="Pesquisar tags..." type="search"><div id="tagsList"></div></section>
</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let role='';const store={genres:[],tags:[]};
async function api(path,method='GET',body){const opt={method,credentials:'same-origin',cache:'no-store'};if(body!==undefined){opt.headers={'Content-Type':'application/json'};opt.body=JSON.stringify(body)}const r=await fetch('/api/forja/'+path,opt);let d;try{d=await r.json()}catch{throw Error('Resposta inválida do servidor.')}if(!r.ok||!d.ok)throw Error(d.error||'Não foi possível concluir.');return d}
function status(text){$('status').textContent=text}function elem(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
function render(type){const list=$(type+'List');list.replaceChildren();const query=$(type+'Search').value.toLocaleLowerCase('pt-BR').trim();const filtered=store[type].filter(x=>x.name.toLocaleLowerCase('pt-BR').includes(query));$(type+'Count').textContent=store[type].length+' opções cadastradas';if(!filtered.length){list.append(elem('p','Nenhuma opção encontrada.'));return}for(const item of filtered){const row=elem('div','');row.className='item';row.append(elem('span',item.name));const actions=elem('div','');actions.className='actions';const edit=elem('button','Editar');edit.type='button';edit.className='secondary';const del=elem('button','Excluir');del.type='button';del.className='danger';if(!['owner','admin'].includes(role)){edit.disabled=del.disabled=true}edit.addEventListener('click',async()=>{const name=prompt('Novo nome:',item.name);if(name===null||name.trim()===item.name)return;if(!name.trim()){status('⚠️ Informe um nome.');return}try{await api(type+'/'+encodeURIComponent(item.id),'PATCH',{name:name.trim()});status('✨ Nome atualizado.');await load(type)}catch(e){status('⚠️ '+e.message)}});del.addEventListener('click',async()=>{if(!confirm('Excluir '+item.name+'? Se estiver associado a alguma obra, a exclusão será bloqueada.'))return;try{await api(type+'/'+encodeURIComponent(item.id),'DELETE');status('✨ Item excluído.');await load(type)}catch(e){status('⚠️ '+e.message)}});actions.append(edit,del);row.append(actions);list.append(row)}}
async function load(type){const d=await api(type);store[type]=d.items||[];render(type)}
for(const type of ['genres','tags']){$(type+'Search').addEventListener('input',()=>render(type));$(type+'Form').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget;const input=form.elements.namedItem('name');const name=input.value.trim();if(!name)return;const button=form.querySelector('button');button.disabled=true;try{await api(type,'POST',{name});input.value='';status('✨ Cadastrado com sucesso!');await load(type)}catch(err){status('⚠️ '+err.message)}finally{button.disabled=false}})}
(async()=>{try{const session=await api('me');role=session.user.role;$('app').hidden=false;if(!['owner','admin'].includes(role)){for(const type of ['genres','tags'])$(type+'Form').querySelectorAll('input,button').forEach(n=>n.disabled=true)}await Promise.all([load('genres'),load('tags')]);status('✨ Gêneros e tags carregados.')}catch(e){status('⚠️ '+e.message);if(e.message.includes('autenticado'))location.href='/forja/index.html'}})();
})();</script><script src="forja-menu.js"></script></body></html>


<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Biblioteca de Obras | Forja Arcana</title>
<style>
:root {
  color-scheme:dark;
  --bg:#100a1b;
  --panel:#211632;
  --border:#49345f;
  --gold:#f7d78b;
  --purple:#a979f0;
  --text:#f3eafb;
  --muted:#c4b4d4;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(circle at top,#29183e,var(--bg) 65%);
  color:var(--text);
  font:15px/1.5 Arial,Helvetica,sans-serif
}
header{
  background:#170f26;
  border-bottom:1px solid var(--border);
  padding:18px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px
}
.brand{font:bold 23px Georgia,serif;color:var(--gold)}
a{color:var(--gold);text-decoration:none}
main{max-width:1180px;margin:35px auto;padding:0 20px}
h1,h2{font-family:Georgia,serif;color:var(--gold)}
h1{font-size:38px;margin:8px 0}
p,.muted{color:var(--muted)}
.eyebrow{color:var(--purple);font-size:12px;letter-spacing:3px}
.layout{
  display:grid;
  grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
  gap:22px;
  margin-top:25px;
  align-items:start
}
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:25px
}
.fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 14px
}
.full{grid-column:1/-1}
label{
  display:block;
  margin:15px 0 6px;
  color:#ddc9f4;
  font-size:13px;
  font-weight:bold
}
input,select,textarea{
  display:block;
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:9px;
  background:#120b1f;
  color:white;
  font:inherit
}
textarea{min-height:115px;resize:vertical}
input:focus,select:focus,textarea:focus{
  outline:2px solid var(--purple)
}
.checks{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  margin-top:15px
}
.checks label{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0
}
.checks input{width:auto}
button{
  cursor:pointer;
  border:1px solid #8f68c2;
  border-radius:10px;
  padding:12px 16px;
  background:#7548b3;
  color:white;
  font-weight:bold
}
button:disabled{opacity:.55;cursor:wait}
button.primary{width:100%;margin-top:20px}
button.secondary{background:#38264e}
.notice{
  margin:20px 0;
  padding:13px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#281a3b
}
.notice.error{color:#ffc3d1;border-color:#a45a74}
.notice.success{color:#b7f5d6;border-color:#4c9a7c}
.work{
  padding:18px 0;
  border-bottom:1px solid var(--border)
}
.work:last-child{border-bottom:0}
.work strong{font-size:17px}
.work .meta{font-size:13px;color:var(--muted)}
.tag{
  display:inline-block;
  margin:8px 5px 0 0;
  padding:4px 9px;
  border-radius:20px;
  background:#3b2856;
  font-size:12px
}
[hidden]{display:none!important}
@media(max-width:850px){
  .layout{grid-template-columns:1fr}
  h1{font-size:30px}
}
@media(max-width:520px){
  .fields{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="brand">⚒️ FORJA ARCANA</div>
  <nav>
    <a href="/forja/painel.html">Salão de Comando</a>
    &nbsp; ✦ &nbsp;
    <a href="/forja/equipe.html">Equipe</a>
  </nav>
</header>

<main>
  <div class="eyebrow">ADMINISTRAÇÃO / ACERVO</div>
  <h1>📚 Biblioteca de Obras</h1>
  <p>Organize o catálogo da Arcana Scan. Novas obras são salvas como rascunho.</p>

  <div id="message" class="notice">Verificando acesso...</div>

  <div id="content" class="layout" hidden>
    <section class="card">
      <h2>✨ Cadastrar obra</h2>
      <form id="workForm">
        <div class="fields">
          <div class="full">
            <label for="title">Título da obra *</label>
            <input id="title" maxlength="200" required>
          </div>

          <div class="full">
            <label for="alternative_title">Título alternativo</label>
            <input id="alternative_title" maxlength="200">
          </div>

          <div class="full">
            <label for="synopsis">Sinopse</label>
            <textarea id="synopsis" maxlength="4000"></textarea>
          </div>

          <div>
            <label for="work_type">Tipo</label>
            <select id="work_type">
              <option value="manhwa">Manhwa</option>
              <option value="manga">Mangá</option>
              <option value="manhua">Manhua</option>
              <option value="webtoon">Webtoon</option>
            </select>
          </div>

          <div>
            <label for="story_status">Situação da história</label>
            <select id="story_status">
              <option value="ongoing">Em andamento</option>
              <option value="completed">Concluída</option>
              <option value="hiatus">Hiato</option>
              <option value="cancelled">Cancelada</option>
            </select>
          </div>

          <div>
            <label for="release_year">Ano</label>
            <input id="release_year" type="number" min="1800" max="2200">
          </div>

          <div>
            <label for="expected_chapters">Capítulos previstos</label>
            <input id="expected_chapters" type="number" min="0" max="100000">
          </div>

          <div>
            <label for="author">Autor</label>
            <input id="author" maxlength="200">
          </div>

          <div>
            <label for="artist">Artista</label>
            <input id="artist" maxlength="200">
          </div>

          <div>
            <label for="scan_name">Scan responsável</label>
            <input id="scan_name" maxlength="200" value="Arcana Scan">
          </div>

          <div>
            <label for="age_rating">Classificação etária</label>
            <input id="age_rating" maxlength="40" placeholder="Ex.: 16+">
          </div>

          <div>
            <label for="decensor_type">Descensura</label>
            <select id="decensor_type">
              <option value="none">Não se aplica</option>
              <option value="official">Oficial</option>
              <option value="arcana">Arcana</option>
            </select>
          </div>

          <div>
            <label for="reading_style">Leitura</label>
            <select id="reading_style">
              <option value="vertical">Vertical</option>
              <option value="horizontal">Horizontal</option>
            </select>
          </div>

          <div class="full">
            <label for="update_days">Dias de atualização</label>
            <input id="update_days" maxlength="100"
                   placeholder="Ex.: Segundas e quintas">
          </div>

          <div class="full">
            <label for="seo_title">Título para buscadores</label>
            <input id="seo_title" maxlength="200">
          </div>

          <div class="full">
            <label for="seo_description">Descrição para buscadores</label>
            <textarea id="seo_description" maxlength="350"></textarea>
          </div>
        </div>

        <div class="checks">
          <label>
            <input id="is_adult" type="checkbox">
            Conteúdo adulto
          </label>
          <label>
            <input id="is_one_shot" type="checkbox">
            One-shot
          </label>
        </div>

        <button id="saveButton" class="primary" type="submit">
          ✨ Salvar como rascunho
        </button>
      </form>
    </section>

    <section class="card">
      <h2>🔮 Obras cadastradas</h2>
      <p>Últimas 50 obras registradas na Forja.</p>
      <button id="refreshButton" class="secondary" type="button">
        ↻ Atualizar biblioteca
      </button>
      <div id="works"></div>
    </section>
  </div>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);
const form = $("workForm");

function showMessage(text, kind = "") {
  $("message").textContent = text;
  $("message").className = "notice" + (kind ? " " + kind : "");
}

async function api(url, options = {}) {
  const response = await fetch(url, {
    ...options,
    credentials: "same-origin",
    cache: "no-store",
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });

  let data;
  try {
    data = await response.json();
  } catch {
    throw new Error("O servidor enviou uma resposta inesperada.");
  }

  if (!response.ok || !data.ok) {
    throw new Error(data.error || "Operação não realizada.");
  }

  return data;
}

function textNode(tag, value, className = "") {
  const node = document.createElement(tag);
  node.textContent = String(value ?? "");
  if (className) node.className = className;
  return node;
}

function optionalText(id) {
  const value = $(id).value.trim();
  return value || null;
}

function optionalNumber(id) {
  const value = $(id).value;
  return value === "" ? null : Number(value);
}

function collectWork() {
  return {
    title: $("title").value.trim(),
    alternative_title: optionalText("alternative_title"),
    synopsis: optionalText("synopsis"),
    work_type: $("work_type").value,
    story_status: $("story_status").value,
    release_year: optionalNumber("release_year"),
    expected_chapters: optionalNumber("expected_chapters"),
    author: optionalText("author"),
    artist: optionalText("artist"),
    scan_name: optionalText("scan_name"),
    age_rating: optionalText("age_rating"),
    decensor_type: $("decensor_type").value,
    reading_style: $("reading_style").value,
    update_days: optionalText("update_days"),
    seo_title: optionalText("seo_title"),
    seo_description: optionalText("seo_description"),
    is_adult: $("is_adult").checked,
    is_one_shot: $("is_one_shot").checked
  };
}

function renderWorks(works) {
  const container = $("works");
  container.replaceChildren();

  if (!works.length) {
    container.append(
      textNode("p", "Nenhuma obra cadastrada ainda.", "muted")
    );
    return;
  }

  const statuses = {
    draft: "Rascunho",
    upcoming: "Revelação",
    published: "Publicada"
  };

  for (const work of works) {
    const item = document.createElement("div");
    item.className = "work";

    item.append(textNode("strong", work.title));
    item.append(textNode(
      "div",
      "Endereço: " + work.slug,
      "meta"
    ));

    item.append(textNode(
      "span",
      statuses[work.publication_status] || work.publication_status,
      "tag"
    ));

    item.append(textNode(
      "span",
      work.work_type,
      "tag"
    ));

    if (work.author) {
      item.append(textNode(
        "div",
        "Autor: " + work.author,
        "meta"
      ));
    }

    // Acesso ao Grimório de Edição
    const editLink = document.createElement("a");

    editLink.href =
      "/forja/editar-obra.html?id=" +
      encodeURIComponent(work.id);

    editLink.textContent = "✏️ Editar obra";

    editLink.style.display = "inline-block";
    editLink.style.marginTop = "14px";
    editLink.style.padding = "10px 16px";
    editLink.style.background = "#7548b3";
    editLink.style.color = "#ffffff";
    editLink.style.borderRadius = "9px";
    editLink.style.fontWeight = "bold";
    editLink.style.textDecoration = "none";

    item.append(editLink);

    container.append(item);
  }
}

async function loadWorks() {
  try {
    const data = await api("/api/forja/works");
    renderWorks(data.works || []);
  } catch (error) {
    showMessage(error.message, "error");
  }
}

form.addEventListener("submit", async event => {
  event.preventDefault();

  const button = $("saveButton");
  button.disabled = true;

  try {
    showMessage("Salvando obra...");
    const result = await api("/api/forja/works", {
      method: "POST",
      body: JSON.stringify(collectWork())
    });

    showMessage(
      "Obra cadastrada como rascunho: " + result.work.title,
      "success"
    );

    form.reset();
    $("scan_name").value = "Arcana Scan";
    await loadWorks();
  } catch (error) {
    showMessage(error.message, "error");
  } finally {
    button.disabled = false;
  }
});

$("refreshButton").addEventListener("click", loadWorks);

async function start() {
  try {
    const data = await api("/api/forja/me");

    if (!["owner", "admin", "moderator"].includes(data.user?.role)) {
      throw new Error("Acesso não autorizado.");
    }

    $("content").hidden = false;
    showMessage(
      "Biblioteca disponível. Bem-vinda, " + data.user.name + "!",
      "success"
    );

    await loadWorks();
  } catch (error) {
    showMessage(error.message, "error");
  }
}

start();
</script>
</body>
</html>

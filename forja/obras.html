<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Todas as Obras • FORJA ARCANA</title><link rel="stylesheet" href="forja-menu.css"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#110b1a;color:#f3e9fb;font:15px/1.6 system-ui}main{max-width:1100px;margin:auto;padding:30px 18px}h1{font:42px Georgia,serif;color:#ebc783}a{color:#e6c4ff}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.toolbar input{flex:1;min-width:220px;background:#24172f;border:1px solid #79518b;border-radius:10px;padding:12px;color:white;font:inherit}.button{display:inline-block;padding:11px 15px;border-radius:10px;background:#77509b;color:white;text-decoration:none}.item{display:flex;gap:16px;align-items:center;background:#21152d;border:1px solid #6d4b7d;border-radius:12px;padding:13px;margin:10px 0}.item img{width:66px;height:90px;object-fit:cover;border-radius:8px}.item .info{flex:1}.item small{display:block;color:#cdb6dc}.item a{text-decoration:none;font-weight:700}#status{color:#e9cb94}</style></head><body><main><h1>📚 Todas as Obras</h1><p>Abra uma obra para editar as informações e gerenciar seus capítulos na mesma tela.</p><div class="toolbar"><input id="search" type="search" placeholder="Pesquisar obras por título"><a class="button" href="cadastro-completo.html">+ Adicionar Nova Obra</a></div><p id="status" role="status"></p><div id="list"></div></main><script src="forja-menu.js"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id);let works=[];function render(){const term=$('search').value.toLocaleLowerCase('pt-BR');$('list').replaceChildren();const shown=works.filter(w=>w.title.toLocaleLowerCase('pt-BR').includes(term));for(const w of shown){const item=document.createElement('article');item.className='item';const img=document.createElement('img');img.src='/api/catalog/media/works/'+w.id+'/cover';img.onerror=()=>{img.src='/LOGO.png'};const info=document.createElement('div');info.className='info';const title=document.createElement('a');title.href='cadastro-completo.html?id='+encodeURIComponent(w.id);title.textContent=w.title;const sub=document.createElement('small');sub.textContent=(w.publication_status||'draft')+' • '+(w.slug||'');const chapters=document.createElement('a');chapters.href='cadastro-completo.html?id='+encodeURIComponent(w.id)+'#capitulos';chapters.textContent='Gerenciar capítulos →';info.append(title,sub,chapters);item.append(img,info);$('list').append(item)}$('status').textContent=shown.length+' obra(s) encontrada(s).'}$('search').addEventListener('input',render);(async()=>{try{const m=await fetch('/api/forja/me',{credentials:'same-origin'}),md=await m.json();if(!m.ok||!md.ok)throw Error('Faça login na Forja.');const r=await fetch('/api/forja/works',{credentials:'same-origin'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Erro');works=d.works||[];render()}catch(e){$('status').textContent='⚠️ '+e.message}})()})();</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Candidaturas • FORJA ARCANA</title><link rel="stylesheet" href="forja-menu.css"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#110b1b;color:#f6eaff;font:15px/1.6 system-ui}main{max-width:1100px;margin:auto;padding:32px 18px}h1{font:40px Georgia,serif;color:#e9c77e}.item{background:#22152e;border:1px solid #79538c;border-radius:14px;padding:20px;margin:15px 0}.item p{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#c9b3d5}select{background:#1a1025;border:1px solid #7e5b91;border-radius:8px;color:white;padding:9px}#status{color:#e9c77e}</style></head><body><main><h1>📨 Candidaturas</h1><p>Gerencie os pedidos de entrada na equipe. Somente owner e admin têm acesso aos dados pessoais.</p><p id="status" role="status"></p><div id="list"></div></main><script src="forja-menu.js"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id);const states={new:'Nova',reviewing:'Em análise',accepted:'Aceita',rejected:'Recusada'};async function api(method='GET',body){const opt={method,credentials:'same-origin',cache:'no-store'};if(body){opt.headers={'Content-Type':'application/json'};opt.body=JSON.stringify(body)}const r=await fetch('/api/forja/recruitment',opt),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||'Erro');return d}async function load(){const d=await api();$('list').replaceChildren();for(const a of d.applications){const box=document.createElement('section');box.className='item';const h=document.createElement('h2');h.textContent=a.name+' • '+a.role;const mail=document.createElement('a');mail.href='mailto:'+encodeURIComponent(a.email);mail.textContent=a.email;const date=document.createElement('p');date.className='muted';date.textContent='Enviada em '+a.created_at;const experience=document.createElement('p');experience.textContent='Experiência: '+(a.experience||'Não informada');const message=document.createElement('p');message.textContent='Mensagem: '+(a.message||'Não informada');const select=document.createElement('select');for(const [v,label] of Object.entries(states))select.add(new Option(label,v));select.value=a.status;select.addEventListener('change',async()=>{select.disabled=true;try{await api('PATCH',{id:a.id,status:select.value});$('status').textContent='✨ Candidatura atualizada.'}catch(e){$('status').textContent='⚠️ '+e.message}finally{select.disabled=false}});box.append(h,mail,date,experience,message,select);$('list').append(box)}if(!d.applications.length)$('status').textContent='Nenhuma candidatura recebida.'}load().catch(e=>{$('status').textContent='⚠️ '+e.message})})();</script></body></html>

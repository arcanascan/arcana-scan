<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0914"><title>Leitor • ARCANA SCAN</title><link rel="icon" href="LOGO.png"><link rel="stylesheet" href="obra-leitor.css"></head><body class="reader"><header class="top"><a href="index.html">🌙 ARCANA SCAN</a><nav><a id="back" href="index.html">Voltar à obra</a><a href="perfil.html">Perfil</a></nav></header><main class="reader-main"><h1 id="heading">Carregando capítulo...</h1><p id="status" role="status">Preparando a leitura...</p><div id="pages" class="reader-pages"></div><p id="end" hidden>✦ Fim do capítulo ✦</p><a id="backBottom" class="chapter-link" href="index.html">← Voltar à obra</a></main><footer>ARCANA SCAN • Boa leitura! 💜</footer>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),slug=q.get('slug'),cap=q.get('cap');if(!slug||!/^[a-z0-9-]+$/.test(slug)||!cap||!/^[0-9a-f-]{36}$/i.test(cap)){$('status').textContent='Endereço inválido.';return}const back='obra.html?slug='+encodeURIComponent(slug);$('back').href=back;$('backBottom').href=back;
(async()=>{try{const r=await fetch('/api/catalog/works/'+encodeURIComponent(slug)+'/chapters/'+encodeURIComponent(cap),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Capítulo indisponível');$('heading').textContent=d.work.title+' • '+d.chapter.chapter_title;document.title=d.chapter.chapter_title+' • '+d.work.title;const pages=$('pages');pages.style.gap=Math.max(0,Math.min(500,Number(d.work.image_gap)||0))+'px';if(d.work.reading_style==='horizontal')pages.classList.add('horizontal');for(const p of d.pages){const img=document.createElement('img');img.src=p.url;img.alt='Página '+p.number;img.loading=p.number<=2?'eager':'lazy';img.decoding='async';pages.append(img)}$('status').hidden=true;$('end').hidden=false;if(!d.pages.length){$('status').hidden=false;$('status').textContent='Nenhuma página disponível.'}}catch(e){$('status').textContent='⚠️ '+e.message}})();})();
</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#160d23"><title>Obra • ARCANA SCAN</title><link rel="icon" href="LOGO.png"><link rel="stylesheet" href="obra-leitor.css"><link rel="stylesheet" href="arcana-conta.css"></head><body><header class="top"><a href="index.html">🌙 ARCANA SCAN</a><nav><a href="index.html#grande-acervo">Biblioteca</a><a href="revelacoes.html">Revelações</a><a href="perfil.html">Meu perfil</a></nav></header><main><div id="status" role="status">Consultando o Grimório Arcano...</div><section id="work" hidden><div id="banner" class="banner"></div><div class="intro"><div class="cover"><img id="cover" alt="Capa da obra"></div><div><span class="kicker">✦ BIBLIOTECA ARCANA</span><h1 id="title"></h1><p id="alt"></p><div id="badges" class="badges"></div><p id="synopsis" class="synopsis"></p><div id="info" class="info"></div><div id="genres" class="badges"></div><div id="readerActions" class="ac-panel" style="margin-top:18px"><h2 style="font-size:20px">💜 Sua biblioteca pessoal</h2><div class="ac-row"><button id="addFavorite" class="ac-btn" type="button">♡ Adicionar aos favoritos</button><label>Adicionar à lista <select id="shelfChoice"><option value="amorzinho">💞 Amorzinho</option><option value="casei-com-a-putaria">🔥 Casei com a Putaria</option><option value="vou-sofrer">🥺 Vou sofrer</option><option value="ler-de-madrugada">🌙 Ler de madrugada</option><option value="meus-xodos">👑 Meus Xodós</option></select></label><button id="addShelf" class="ac-btn" type="button">+ Adicionar</button></div><p id="readerActionsStatus" role="status"></p></div></div></div><section class="chapters"><h2>📖 Capítulos</h2><div id="chapters"></div></section></section></main><footer>ARCANA SCAN • Cada história merece sua magia.</footer>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const slug=new URLSearchParams(location.search).get('slug');if(!slug||!/^[a-z0-9-]+$/.test(slug)){$('status').textContent='Endereço de obra inválido.';return}
(async()=>{try{const r=await fetch('/api/catalog/works/'+encodeURIComponent(slug),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Obra indisponível');const w=d.work;document.title=w.title+' • ARCANA SCAN';$('title').textContent=w.title;$('alt').textContent=w.alternative_title||'';$('synopsis').textContent=w.synopsis||'Sinopse em preparação.';const cover=$('cover');cover.src=w.images.cover||'LOGO.png';if(w.images.banner)$('banner').style.backgroundImage=`linear-gradient(90deg,#150e1fd9,#150e1f50),url(${w.images.banner})`;else $('banner').style.background='linear-gradient(100deg,#2c1b41,#150e1f)';
const info=$('info');for(const [key,val] of [['Tipo',w.work_type],['Situação',w.story_status],['Autor(es)',w.author],['Artista(s)',w.artist],['Scan',w.scan_name],['Ano',w.release_year],['Classificação',w.age_rating]])if(val){const div=document.createElement('p');const b=document.createElement('strong');b.textContent=key+': ';div.append(b,document.createTextNode(String(val)));info.append(div)}
const badges=$('badges');for(const text of [w.work_type,w.is_adult?'18+':null])if(text){const span=document.createElement('span');span.textContent=text;badges.append(span)}for(const name of [...d.genres,...d.tags]){const b=document.createElement('span');b.textContent=name;$('genres').append(b)}
const ch=$('chapters');if(!d.chapters.length){ch.textContent='Os capítulos ainda não foram publicados.'}else for(const c of d.chapters){const a=document.createElement('a');a.className='chapter-link';a.href='ler.html?slug='+encodeURIComponent(w.slug)+'&cap='+encodeURIComponent(c.id);const title=document.createElement('strong');title.textContent=c.chapter_title||'Capítulo '+c.chapter_number;const count=document.createElement('small');count.textContent=c.page_count+' páginas';a.append(title,count);ch.append(a)}for(const [button,kind] of [['addFavorite','favorites'],['addShelf','lists']]){$(button).addEventListener('click',async()=>{const b=$(button);b.disabled=true;try{const payload={work_id:w.id};if(kind==='lists')payload.shelf=$('shelfChoice').value;const r=await fetch('/api/reader/'+kind,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Não foi possível salvar.');$('readerActionsStatus').textContent='✨ Obra salva!'}catch(e){$('readerActionsStatus').textContent='⚠️ '+e.message+' Entre em Meu Perfil se necessário.'}finally{b.disabled=false}})}$('work').hidden=false;$('status').hidden=true}catch(e){$('status').textContent='⚠️ '+e.message}})();})();
</script></body></html>

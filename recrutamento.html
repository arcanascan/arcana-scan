<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recrutamento • ARCANA SCAN</title><link rel="icon" href="/LOGO.png"><link rel="stylesheet" href="/arcana-conta.css"></head><body class="arcana-sub" data-arcana-page="recrutamento"><header class="ac-top"><a href="/index.html">✦ ARCANA SCAN</a><nav><a href="/index.html">Biblioteca</a><a href="/generos.html">Gêneros</a><a href="/favoritos.html">Favoritos</a><a href="/minhas-listas.html">Minhas Listas</a><a href="/perfil.html">Meu Perfil</a></nav></header><main class="ac-main"><h1>Recrutamento</h1><p class="ac-muted">Quer ajudar a dar vida às histórias? Envie sua candidatura para a equipe ARCANA.</p><section class="ac-panel"><h2>Faça parte da equipe</h2><p>Escolha a função que mais combina com você. A candidatura será analisada pela administração da ARCANA.</p><form id="ac-apply"><label class="ac-field">Seu nome<input name="name" required maxlength="100" autocomplete="name"></label><label class="ac-field">E-mail para contato<input type="email" name="email" required maxlength="254" autocomplete="email"></label><label class="ac-field">Função desejada<select id="ac-role" name="role" required><option value="">Selecione uma função</option></select></label><label class="ac-field">Experiência (opcional)<textarea name="experience" maxlength="1000" placeholder="Conte o que você já sabe fazer"></textarea></label><label class="ac-field">Sua mensagem (opcional)<textarea name="message" maxlength="2000" placeholder="Conte um pouquinho sobre você"></textarea></label><div hidden aria-hidden="true"><label>Site<input name="website" tabindex="-1" autocomplete="off"></label></div><button class="ac-btn" type="submit">✦ Enviar candidatura</button></form></section><p id="ac-status" class="ac-status" role="status" aria-live="polite"></p></main><script src="/arcana-conta.js" defer></script></body></html>

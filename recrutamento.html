<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recrutamento • ARCANA SCAN</title><link rel="icon" href="/LOGO.png"><link rel="stylesheet" href="/arcana-conta.css"><style>
/* Recrutamento — mesma biblioteca e personagem oficial da ARCANA */
#ac-language-field[hidden]{display:none!important}
body.arcana-sub{background:#08050d url('/BIBLIOTECA-ARCANA.png') center center / cover fixed no-repeat;isolation:isolate}
body.arcana-sub::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(8,4,14,.88),rgba(16,8,25,.67) 55%,rgba(8,4,14,.82)),linear-gradient(0deg,rgba(10,5,16,.85),transparent 60%)}
header.ac-top{position:relative;z-index:2;background:rgba(16,9,26,.85);backdrop-filter:blur(10px);border-bottom-color:rgba(220,182,126,.35)}
header.ac-top>a{display:inline-flex;align-items:center;gap:10px}
header.ac-top>a img{width:42px;height:42px;object-fit:contain}
main.ac-main.ac-recruit-main{max-width:1240px;padding-top:clamp(26px,4vw,58px)}
.ac-recruit-heading{max-width:700px;margin-bottom:24px}
.ac-recruit-heading h1{color:#f4d28d;text-shadow:0 2px 20px #130b1b}
.ac-recruit-heading p{color:#f4e9f8}
.ac-recruit-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,.85fr);gap:clamp(14px,3vw,42px);align-items:stretch}
.ac-recruit-layout .ac-panel{margin:0;background:linear-gradient(145deg,rgba(33,18,47,.95),rgba(19,10,30,.95));border:1px solid rgba(195,143,221,.62);box-shadow:0 18px 60px rgba(0,0,0,.45);backdrop-filter:blur(8px);padding:clamp(18px,3vw,30px)}
.ac-recruit-layout .ac-panel h2{margin-top:0}
.ac-recruit-character{position:relative;display:flex;align-items:end;justify-content:center;min-height:560px;overflow:hidden}
.ac-recruit-character::before{content:"";position:absolute;inset:12% 0 5%;background:radial-gradient(ellipse at 50% 55%,rgba(138,74,177,.30),transparent 66%);pointer-events:none}
.ac-recruit-character img{position:relative;display:block;width:100%;height:100%;max-height:860px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 18px 26px rgba(0,0,0,.72))}
.ac-recruit-character figcaption{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font:700 15px Georgia,serif;letter-spacing:.16em;color:#f6d99d;text-shadow:0 2px 10px #000;background:rgba(19,10,29,.58);border:1px solid rgba(235,198,128,.4);border-radius:30px;padding:7px 18px}
.ac-recruit-layout .ac-field input:focus-visible,.ac-recruit-layout .ac-field select:focus-visible,.ac-recruit-layout .ac-btn:focus-visible{outline:2px solid #f1cd8b;outline-offset:2px}
@media(max-width:760px){body.arcana-sub{background-attachment:scroll} .ac-recruit-layout{grid-template-columns:minmax(0,1fr)}.ac-recruit-character{min-height:0;height:clamp(250px,68vw,440px);order:-1}.ac-recruit-character img{height:100%;max-width:440px}.ac-recruit-character figcaption{bottom:0}.ac-recruit-layout .ac-panel{padding:18px}.ac-recruit-heading{margin-bottom:12px}}
@media(prefers-reduced-motion:reduce){header.ac-top{backdrop-filter:none}}
</style></head><body class="arcana-sub" data-arcana-page="recrutamento"><header class="ac-top"><a href="/index.html"><img src="/LOGO.png" alt="" width="42" height="42">ARCANA SCAN</a><nav><a href="/index.html">Biblioteca</a><a href="/generos.html">Gêneros</a><a href="/favoritos.html">Favoritos</a><a href="/minhas-listas.html">Minhas Listas</a><a href="/perfil.html">Meu Perfil</a></nav></header><main class="ac-main ac-recruit-main"><div class="ac-recruit-heading"><h1>Recrutamento</h1><p class="ac-muted">Quer ajudar a dar vida às histórias? Envie sua candidatura para a equipe ARCANA.</p></div><div class="ac-recruit-layout"><section class="ac-panel"><h2>Faça parte da equipe</h2><p>Escolha a função que mais combina com você. A candidatura será analisada pela administração da ARCANA.</p><form id="ac-apply"><label class="ac-field">Nome<input name="name" required maxlength="100" autocomplete="name" placeholder="Seu nome completo"></label><label class="ac-field">Data de Nascimento<input type="date" id="ac-birth" name="birth_date" required autocomplete="bday"></label><label class="ac-field">Nick Desejado<input name="nickname" required minlength="2" maxlength="40" autocomplete="nickname" placeholder="Como deseja ser chamado(a) na ARCANA"></label><label class="ac-field">E-mail<input type="email" name="email" required maxlength="254" autocomplete="email"></label><label class="ac-field">Telefone<input type="tel" name="phone" required maxlength="25" autocomplete="tel" inputmode="tel" placeholder="+55 DDD 00000-0000"></label><label class="ac-field">Função Desejada<select id="ac-role" name="role" required><option value="">Selecione uma função</option></select></label><label class="ac-field" id="ac-language-field" hidden>Idioma desejado<select id="ac-language" name="language" disabled><option value="">Selecione o idioma</option><option value="Inglês">Inglês</option><option value="Espanhol">Espanhol</option><option value="Coreano">Coreano</option><option value="Francês">Francês</option></select></label><div hidden aria-hidden="true"><label>Site<input name="website" tabindex="-1" autocomplete="off"></label></div><button class="ac-btn" type="submit">✦ Enviar candidatura</button></form><p id="ac-status" class="ac-status" role="status" aria-live="polite"></p></section><figure class="ac-recruit-character"><img src="/LUCIEN.png" alt="Lucien, personagem oficial da ARCANA, ao lado do formulário de recrutamento" width="750" height="1100"><figcaption>LUCIEN</figcaption></figure></div></main><script src="/arcana-conta.js" defer></script></body></html>
